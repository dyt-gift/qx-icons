# Quantumult X V2 - AI / Streaming / Developer / China Direct
# 2026-10
#
# 重要：
# 1. 机场订阅请在 Quantumult X 节点资源中单独添加（不放在公开配置里）。
# 2. 地区策略通过 server-tag-regex 按节点名称自动归类，手动选择节点。
# 3. 节点名中的 - / _ / 空格 / emoji 不会影响匹配。
# 4. 业务策略独立：国内 AI、海外 AI、开发工具、流媒体分别管理。
# 5. 国内银行/政务/国家电网等默认 DIRECT。
#
# Quantumult X 官方 sample.conf：
# https://github.com/crossutility/Quantumult-X/blob/master/sample.conf

[general]
server_check_url=http://www.gstatic.com/generate_204
server_check_timeout=5000
dns_exclusion_list=*.cmpassport.com,*.jegotrip.com.cn,*.icitymobile.mobi,id6.me

[dns]
server=223.5.5.5
server=119.29.29.29
server=1.1.1.1
server=8.8.8.8

[server_local]

[server_remote]
# 订阅不放在公开仓库，请在 Quantumult X 的节点资源里单独添加你的机场订阅。

[policy]

# ============================================================
# ① 基础
# ============================================================

static=🚦 节点选择,🌍 全球自动,🇭🇰 香港节点,🇯🇵 日本节点,🇸🇬 新加坡节点,🇺🇸 美国节点,🇰🇷 韩国节点,🇬🇧 英国节点,🇩🇪 德国节点,🇳🇱 荷兰节点,DIRECT,img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Static.png

# ============================================================
# ② 国家/地区节点选择策略（手动选择，不测速）
# ============================================================
#
# 使用“包含 + 排除”的正则：
# - 能匹配 美国-01 / US-01 / 🇺🇸 Los-Angeles-01
# - 同时避免 US 节点被错误归入其他国家
# - 排除 回国/官网/客服/订阅/群/TG/流量/到期 等非节点标签
#

url-latency-benchmark=🌍 全球自动,server-tag-regex=^(?!.*(?i)(回国|校园|教育|官网|客服|网站|网址|订阅|流量|到期|机场|官址|备用|群|TG|获取|版本|直连|DIRECT)).*$,check-interval=600,tolerance=80,alive-checking=true,img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png

static=🇭🇰 香港节点,server-tag-regex=^(?=.*(?i)(🇭🇰|香港|香港节点|港|HK|HKG|Hong ?Kong))(?!(.*(?i)(台湾|台|TW|Japan|日本|JP|Korea|韩国|KR|Singapore|新加坡|SG|United ?States|USA|US|美国))).*$,img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png

static=🇯🇵 日本节点,server-tag-regex=^(?=.*(?i)(🇯🇵|日本|东京|大阪|Japan|Tokyo|Osaka|JP|JPN))(?!(.*(?i)(香港|HK|台湾|TW|韩国|KR|新加坡|SG|美国|USA|US))).*$,img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png

static=🇸🇬 新加坡节点,server-tag-regex=^(?=.*(?i)(🇸🇬|新加坡|狮城|Singapore|SG|SGP))(?!(.*(?i)(香港|HK|台湾|TW|日本|JP|韩国|KR|美国|USA|US))).*$,img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png

static=🇺🇸 美国节点,server-tag-regex=^(?=.*(?i)(🇺🇸|美国|美|洛杉矶|纽约|旧金山|圣何塞|西雅图|芝加哥|达拉斯|硅谷|加州|United ?States|USA|US|Los ?Angeles|New ?York|California|San ?Jose|Seattle))(?!(.*(?i)(香港|HK|台湾|TW|日本|JP|韩国|KR|新加坡|SG))).*$,img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png

static=🇰🇷 韩国节点,server-tag-regex=^(?=.*(?i)(🇰🇷|韩国|首尔|Korea|Seoul|KR|KOR))(?!(.*(?i)(香港|HK|台湾|TW|日本|JP|新加坡|SG|美国|USA|US))).*$,img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Korea.png

static=🇬🇧 英国节点,server-tag-regex=^(?=.*(?i)(🇬🇧|英国|伦敦|United ?Kingdom|UK|London|GB))(?!(.*(?i)(美国|USA|US|日本|JP|香港|HK|新加坡|SG|韩国|KR))).*$,img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_Kingdom.png

static=🇩🇪 德国节点,server-tag-regex=^(?=.*(?i)(🇩🇪|德国|法兰克福|Germany|Frankfurt|DE))(?!(.*(?i)(美国|USA|US|日本|JP|香港|HK|新加坡|SG|韩国|KR))).*$,img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Germany.png

static=🇳🇱 荷兰节点,server-tag-regex=^(?=.*(?i)(🇳🇱|荷兰|阿姆斯特丹|Netherlands|Amsterdam|NL))(?!(.*(?i)(美国|USA|US|日本|JP|香港|HK|新加坡|SG|韩国|KR))).*$,img-url=https://raw.githubusercontent.com/dyt-gift/qx-icons/main/Netherlands.png?v=2

